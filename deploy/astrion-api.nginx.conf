# /etc/nginx/sites-available/astrion-api.conf
#
# La API en su propio dominio, para herramientas y depuracion. El JUEGO no pasa
# por aqui: usa /api/ del mismo origen, porque la API no tiene CORS y el
# navegador bloquearia la llamada entre dominios. Ver astrion.nginx.conf.
server {
    listen 80;
    listen [::]:80;
    server_name astrion-api.turname.mx;

    location / {
        proxy_pass         http://127.0.0.1:5110;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
