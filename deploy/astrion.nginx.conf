# /etc/nginx/sites-available/astrion.conf — el juego.
#
# La API se sirve DESDE AQUI, en /api/, y no desde astrion-api.turname.mx. El
# motivo no es comodidad: la API de v1 no tiene CORS configurado, asi que un
# navegador que cargue el juego en un dominio y llame a otro se lo bloquea.
# Mismo origen es la solucion que no necesita codigo, y ademas deja la API sin
# superficie publica que endurecer. El subdominio astrion-api sigue existiendo
# para herramientas y depuracion.
server {
    listen 80;
    listen [::]:80;
    server_name astrion.turname.mx;

    root /var/www/astrion;
    index index.html;

    # La barra final del proxy_pass es la que quita el /api del camino:
    # /api/v1/auth/login -> /v1/auth/login. Sin ella la API recibe /api/v1/... y
    # devuelve 404 en todo, que se lee como "la API esta caida" y no lo esta.
    location /api/ {
        proxy_pass         http://127.0.0.1:5110/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # El .pck son cientos de megas y no cambia entre recargas: que el navegador
    # no se lo baje otra vez en cada F5 del tester.
    location ~* \.(pck|wasm)$ {
        add_header Cache-Control "public, max-age=604800";
        # Sirve index.wasm.gz si existe. PRECOMPRIMIDO en el despliegue, no al
        # vuelo: comprimir 38 MB en cada peticion es CPU por tester, y este
        # servidor tiene otros dos proyectos encima.
        gzip_static on;
    }

    # gzip al vuelo solo para lo pequenio. El `gzip on` global de nginx no llegaba
    # aqui: su `gzip_types` por defecto es solo text/html, asi que el wasm y el
    # pck viajaban CRUDOS — 37,7 MB de un fichero que comprime a 9,7.
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # Y el .pck NO se comprime, medido: 93,9 MB pasan a 93,6 (99%). Ya son
    # texturas comprimidas. Gzipearlo seria quemar CPU para no ahorrar nada.

    location / {
        try_files $uri $uri/ =404;
    }
}
